# ============================================================
# MDT Subscription Definitions
# ============================================================
# This file defines the 66 current telemetry subscriptions.
# Used by: validate.py, generate_ios_config.py, collector-config.yaml
#
# Subscription IDs use tier-based numbering:
#   30xxx = HOT (30s), 60xxx = WARM (60s), 50xxx = COOL (300s)
#
# Each entry maps a subscription ID to its XPath, polling tier,
# YANG module, and expected key/metric fields for validation.
# ============================================================

receiver:
  ip: RECEIVER_IP
  port: 57500
  protocol: grpc-tcp
tiers:
  hot:
    interval_sec: 30
    interval_cs: 3000
  warm:
    interval_sec: 60
    interval_cs: 6000
  cool:
    interval_sec: 300
    interval_cs: 30000
subscriptions:
  30001:
    section: 1
    name: CPU Utilization
    yang_module: Cisco-IOS-XE-process-cpu-oper
    xpath: /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization
    tier: hot
    expected_keys: []
    expected_metrics:
    - five-seconds
    - one-minute
    - five-minutes
    expected_dimensions:
    - source
  30002:
    section: 3
    name: Process Memory
    yang_module: Cisco-IOS-XE-process-memory-oper
