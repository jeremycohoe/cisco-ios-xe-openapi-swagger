# Telegraf — local Cisco MDT gRPC dial-out receiver (capture on THIS host)
# ---------------------------------------------------------------------------
# The cisco_telemetry_mdt input natively decodes Cisco IOS XE Model-Driven
# Telemetry (gRPC dial-out, kvGPB) — no external protos needed. A device
# subscription points its receiver at <this-host-ip>:57500 (plaintext,
# "protocol grpc-tcp"). Decoded metrics are written to ./output as JSON so we
# can grab a real payload here.
[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true
  quiet = false

# gRPC dial-out listener for Cisco MDT.
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57500"

# --- per-device routing (one receiver; source hostname -> its own file) ----
# Parallel walks on different devices never cross-contaminate. Add a device by
# copying a block with its `source` hostname.
[[outputs.file]]
  files = ["/output/mdt-C9300.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-C9300-2"]

[[outputs.file]]
  files = ["/output/mdt-C9400.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-C9400"]

[[outputs.file]]
  files = ["/output/mdt-C9200.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-C9200L"]

[[outputs.file]]
  files = ["/output/mdt-C9500.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-C9500"]

[[outputs.file]]
  files = ["/output/mdt-C9600.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-C9600"]

[[outputs.file]]
  files = ["/output/mdt-C9800.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  [outputs.file.tagpass]
    source = ["JCOHOE-9840-ZTP"]

# --- catch-all: full fleet stream (all sources) ----------------------------
[[outputs.file]]
  files = ["/output/mdt-live.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
